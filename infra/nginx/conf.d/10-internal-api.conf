# Internal API listener — the web tier relays /api/* here (API_URL in the web
# image). Bound to the private IP only; UFW allows it from tmsapp01-03 only.
# The API is not published on the internet (decision: API internal only).
server {
    listen 172.20.15.55:8090;
    server_name _;

    # Requests arrive from the app servers carrying the client's IP in
    # X-Forwarded-For (set by the public listener, passed on by Next.js).
    # Trust only our own hops, so $remote_addr becomes the real client IP.
    set_real_ip_from  172.20.15.55;
    set_real_ip_from  172.20.15.56;
    set_real_ip_from  172.20.15.57;
    set_real_ip_from  172.20.15.58;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Health checks (deploy script, monitoring) are not rate limited.
    location = /health {
        access_log off;
        proxy_pass http://tms_api;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Login endpoints: strict per-IP limit against password guessing.
    location ~ ^/api/(auth/login|auth/moc-oauth/|portal/auth/login) {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://tms_api;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://tms_api;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
