# tms.moc.gov.kh on port 80: Let's Encrypt HTTP-01 challenges, everything else
# redirected to HTTPS.
server {
    listen 80;
    server_name tms.moc.gov.kh;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
