# tms.moc.gov.kh over HTTPS. Installed into conf.d only once the Let's Encrypt
# certificate exists (see infra/scripts/phase6-lb.sh and issue-cert.sh).
server {
    listen 443 ssl;
    http2 on;
    server_name tms.moc.gov.kh;
    # Traffic arrives via Cloudflare: $remote_addr becomes the real visitor
    # (rate limits, logs, and the X-Forwarded-For sent to the apps).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/tms.moc.gov.kh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tms.moc.gov.kh/privkey.pem;

    # Mozilla "intermediate": TLS 1.2 + 1.3 only, modern AEAD ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt stopped providing OCSP responders in 2025.

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    limit_req zone=web_general burst=100 nodelay;

    location / {
        proxy_pass http://tms_web;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-Forwarded-Proto https;
        # Replace (not append): client-supplied X-Forwarded-For is discarded.
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Headers the edge owns (avoid duplicates from the apps).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }
}
