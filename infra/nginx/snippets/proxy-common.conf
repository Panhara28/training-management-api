# Shared proxy settings for both upstreams.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# X-Forwarded-For / X-Forwarded-Proto are set per listener (public edge
# replaces them, the internal hop appends).
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 1s;   # LAN: a healthy upstream connects in ms; fail over fast when a host vanishes
proxy_send_timeout    120s;
proxy_read_timeout    120s;   # batch certificate PDFs can take a while

# Failover so a deploy (Pongreay stops one container at a time) is invisible:
# - error/timeout: the upstream could not be connected to / did not answer;
# - http_502/http_503: the upstream said it cannot serve right now.
# Non-idempotent requests (POST, PATCH, ...) are NOT retried once they may have
# reached an app server — nginx only passes them on if the connection itself
# failed before the request was sent, so a form can never be submitted twice.
proxy_next_upstream         error timeout http_502 http_503;
proxy_next_upstream_tries   2;
proxy_next_upstream_timeout 10s;

# Apps set their own security headers; the edge sets them once (no duplicates).
proxy_hide_header X-Powered-By;
