# App servers (Pongreay host ports). Only tmslb may reach them (DOCKER-USER).
upstream tms_web {
    least_conn;
    server 172.20.15.56:3000 max_fails=3 fail_timeout=30s;
    server 172.20.15.57:3000 max_fails=3 fail_timeout=30s;
    server 172.20.15.58:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream tms_api {
    least_conn;
    server 172.20.15.56:8090 max_fails=3 fail_timeout=30s;
    server 172.20.15.57:8090 max_fails=3 fail_timeout=30s;
    server 172.20.15.58:8090 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# Rate limits, keyed on the real client IP.
limit_req_zone $binary_remote_addr zone=web_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;
limit_req_status  429;
limit_conn_status 429;
