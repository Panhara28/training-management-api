# Nginx load balancer for TMS — installed to /srv/tms/nginx/compose.yml on tmslb.
# Host networking so UFW rules apply (published ports would bypass UFW).
name: tms-nginx

services:
  nginx:
    image: nginx:1.30.5-alpine
    container_name: tms-nginx
    network_mode: host
    restart: unless-stopped
    volumes:
      - /srv/tms/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/tms/nginx/conf.d:/etc/nginx/conf.d:ro
      - /srv/tms/nginx/snippets:/etc/nginx/snippets:ro
      - /srv/tms/nginx/acme:/var/www/acme:ro
      - /srv/tms/letsencrypt:/etc/letsencrypt:ro
      - /srv/tms/nginx/logs:/var/log/nginx
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
