# TMS load balancer (tmslb, 172.20.15.55) — nginx 1.30 stable.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time '
                    'ua=$upstream_addr us=$upstream_status urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65s;
    keepalive_requests 1000;

    client_header_timeout 30s;
    client_body_timeout   60s;
    send_timeout          60s;
    client_max_body_size  50m;   # training material uploads

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/xml application/rss+xml image/svg+xml;

    # WebSocket upgrade; empty Connection keeps upstream keepalive working.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}
