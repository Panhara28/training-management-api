# Anything that is not an exact, known Host (raw IP, scanners, other names):
# close the connection without a response. On 443 the TLS handshake itself is
# rejected, so no certificate is revealed.
server {
    listen 80  default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    access_log off;
    return 444;
}
